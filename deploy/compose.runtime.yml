# Installed root-owned policy; image selection is the only release input.
# Never run up without an explicit APP service and --no-deps. Postgres remains untouched.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:-moss}
    volumes:
      - pgdata:/var/lib/postgresql
    networks: [default]
  server:
    image: ${SERVER_IMAGE:?digest required}
    restart: unless-stopped
    stop_grace_period: 90s
    environment:
      RELEASE_SHA: ${RELEASE_SHA:?required}
      PORT: "8080"
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-moss}
      DATABASE_USER: ${POSTGRES_USER:?required}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?required}
      JWT_SECRET: ${JWT_SECRET:?required}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?required}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?required}
      FILES_DIR: /data/files
      SYNC_INTERNAL_URL: http://sync:1235
      SYNC_INTERNAL_SECRET: ${SYNC_INTERNAL_SECRET:?required}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?required}
      MCP_RESOURCE_URL: ${MCP_RESOURCE_URL:-}
      MOSS_TERMS_VERSION: ${MOSS_TERMS_VERSION:?required}
      MOSS_ACCOUNT_CAP: ${MOSS_ACCOUNT_CAP:-100}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["filedata:/data/files"]
    networks: [default]
  sync:
    image: ${SYNC_IMAGE:?digest required}
    restart: unless-stopped
    stop_grace_period: 90s
    environment:
      RELEASE_SHA: ${RELEASE_SHA:?required}
      PORT: "1234"
      INTERNAL_PORT: "1235"
      SYNC_INTERNAL_HOST: "0.0.0.0"
      SYNC_INTERNAL_SECRET: ${SYNC_INTERNAL_SECRET:?required}
      DATABASE_URL: postgres://postgres:5432/${POSTGRES_DB:-moss}
      DATABASE_USER: ${POSTGRES_USER:?required}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?required}
      JWT_SECRET: ${JWT_SECRET:?required}
      KTOR_INTERNAL_URL: http://server:8080
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?required}
      MCP_RESOURCE_URL: ${MCP_RESOURCE_URL:-}
    ports: ["127.0.0.1:1234:1234"]
    networks: [default]
  web:
    image: ${WEB_IMAGE:?digest required}
    restart: unless-stopped
    stop_grace_period: 90s
    environment:
      RELEASE_SHA: ${RELEASE_SHA:?required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MOSS_INTERNAL_API_URL: http://server:8080
    ports: ["127.0.0.1:3001:3000"]
    networks: [default]
volumes:
  pgdata:
    external: true
    name: moss_pgdata
  filedata:
    external: true
    name: moss_filedata
networks:
  default:
    external: true
    name: moss_default
