name: audit

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: fail on high or critical advisories
        run: |
          bun audit --json > /tmp/bun-audit.json || true
          bun -e '
            const r = await Bun.file("/tmp/bun-audit.json").json();
            const bad = Object.values(r).flatMap((p) => p.advisories ?? p).filter((a) => a && ["high","critical"].includes(String(a.severity)));
            if (bad.length) { console.error(bad.map((a) => a.title || a.id).join("\n")); process.exit(1); }
          '

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew dependencyCheckAnalyze -PfailBuildOnCVSS=7
