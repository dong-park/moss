name: audit

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: fail on high or critical advisories
        run: |
          bun audit --json > /tmp/bun-audit.json || true
          bun -e '
            const r = await Bun.file("/tmp/bun-audit.json").json();
            const bad = Object.values(r).flatMap((p) => p.advisories ?? p).filter((a) => a && ["high","critical"].includes(String(a.severity)));
            if (bad.length) { console.error(bad.map((a) => a.title || a.id).join("\n")); process.exit(1); }
          '

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # 키 없이 NVD를 받으면 요청이 막혀 분석이 실패한다. 이유를 바로 보이게 먼저 멈춘다.
      - name: require NVD API key
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::error::NVD_API_KEY 저장소 시크릿이 없다. https://nvd.nist.gov/developers/request-an-api-key 에서 받아 등록한다."
            exit 1
          fi
      # 전체 NVD 다운로드는 키가 있어도 수십 분 걸린다. 받은 데이터를 다음 실행에 다시 쓴다.
      - uses: actions/cache@v4
        with:
          path: ~/.gradle/dependency-check-data
          key: nvd-${{ github.run_id }}
          restore-keys: nvd-
      - run: ./gradlew dependencyCheckAnalyze -PfailBuildOnCVSS=7
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
