name: release
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  audit:
    uses: ./.github/workflows/audit.yml
    secrets:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check workflow syntax with verified actionlint
        run: |
          curl --fail --silent --show-error --location https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o /tmp/actionlint.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint
      - run: python3 -m unittest discover -s scripts/deploy/tests -v
  build:
    needs: [ci, audit, contract]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: production
      deployment: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        service: [web, server, sync]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate complete public configuration
        env:
          API_URL: ${{ vars.NEXT_PUBLIC_MOSS_API_URL }}
          SYNC_URL: ${{ vars.NEXT_PUBLIC_MOSS_SYNC_URL }}
          GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          TERMS_VERSION: ${{ vars.NEXT_PUBLIC_MOSS_TERMS_VERSION }}
        run: python3 scripts/deploy/publish.py config > public-config.json
      - id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.service == 'server' && './server' || '.' }}
          file: ${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/dong-park/moss-${{ matrix.service }}:${{ github.sha }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=https://github.com/dong-park/moss
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            BUILD_SHA=${{ github.sha }}
            NEXT_PUBLIC_MOSS_API_URL=${{ vars.NEXT_PUBLIC_MOSS_API_URL }}
            NEXT_PUBLIC_MOSS_SYNC_URL=${{ vars.NEXT_PUBLIC_MOSS_SYNC_URL }}
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_MOSS_TERMS_VERSION=${{ vars.NEXT_PUBLIC_MOSS_TERMS_VERSION }}
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/dong-park/moss-${{ matrix.service }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Save exact image identity
        env:
          SERVICE: ${{ matrix.service }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: python3 scripts/deploy/publish.py image > image.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-${{ matrix.service }}-${{ github.run_attempt }}
          path: image.json
          if-no-files-found: error
          retention-days: 30
  rehearsal:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      deployment: false
    permissions:
      contents: read
      packages: read
      deployments: read
      id-token: write
      attestations: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: image-*-${{ github.run_attempt }}
          path: images
      - name: Assemble exact candidate and successful baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_URL: ${{ vars.NEXT_PUBLIC_MOSS_API_URL }}
          SYNC_URL: ${{ vars.NEXT_PUBLIC_MOSS_SYNC_URL }}
          GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          TERMS_VERSION: ${{ vars.NEXT_PUBLIC_MOSS_TERMS_VERSION }}
        run: python3 scripts/deploy/publish.py inputs
      - name: Run authenticated actual-image compatibility and recovery rehearsal
        run: |
          bun install --cwd sync --frozen-lockfile
          bun run deploy/rehearsal/pull.mjs --input rehearsal-input.json
          bun run deploy/rehearsal/run.ts --input rehearsal-input.json --output evidence.json
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: evidence.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence-${{ github.run_attempt }}
          path: evidence.json
          if-no-files-found: error
          retention-days: 90
  request:
    needs: [ci, audit, contract, build, rehearsal]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
      deployments: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-evidence-${{ github.run_attempt }}
      - name: Request and await host-verified production deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/deploy/publish.py request
